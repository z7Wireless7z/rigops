// ── COMPRESSIONE FOTO ──────────────────────────────────────────
// Una foto da telefono pesa 3-4 MB e riempirebbe la memoria in pochi scatti.
// Qui si scende a ~400 KB MA tenendo il lato lungo a 1920px e la qualita' all'82%:
// e' piu' della risoluzione di qualunque schermo di telefono, quindi a schermo
// intero resta nitida e si puo' zoomare senza vedere i quadretti.
function comprimi(file, latoMax=1920, qualita=0.82){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let {width:w,height:h}=img;
        if(w>latoMax||h>latoMax){ const s=latoMax/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        res(c.toDataURL('image/jpeg',qualita));
      };
      img.onerror=()=>res(null);
      img.src=r.result;
    };
    r.onerror=()=>res(null);
    r.readAsDataURL(file);
  });
}
const pesoKB = s => Math.round((String(s).length*0.75)/1024);

function agganciaZoom(){
  const area=document.getElementById('lb-area'), img=document.getElementById('lb-img');
  if(!area||!img) return;
  let scala=1, tx=0, ty=0;
  const punt=new Map(); let dist0=0, scala0=1, cx=0, cy=0, tx0=0, ty0=0;

  const applica=()=>{
    if(scala<=1){ scala=1; tx=0; ty=0; }
    img.style.transform=`translate(${tx}px,${ty}px) scale(${scala})`;
    const h=document.getElementById('lb-hint'); if(h) h.style.opacity = scala>1?'0':'1';
  };
  area.addEventListener('pointerdown',e=>{
    area.setPointerCapture(e.pointerId);
    punt.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(punt.size===2){
      const [a,b]=[...punt.values()];
      dist0=Math.hypot(a.x-b.x,a.y-b.y); scala0=scala;
      cx=(a.x+b.x)/2; cy=(a.y+b.y)/2; tx0=tx; ty0=ty;
    } else { tx0=tx; ty0=ty; cx=e.clientX; cy=e.clientY; }
  });
  area.addEventListener('pointermove',e=>{
    if(!punt.has(e.pointerId)) return;
    punt.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(punt.size===2){
      const [a,b]=[...punt.values()];
      const d=Math.hypot(a.x-b.x,a.y-b.y);
      scala=Math.min(6,Math.max(1,scala0*(d/dist0)));
      applica();
    } else if(scala>1){
      tx=tx0+(e.clientX-cx); ty=ty0+(e.clientY-cy);
      applica();
    }
  });
  const su=e=>{ punt.delete(e.pointerId); if(punt.size<2){ scala0=scala; tx0=tx; ty0=ty; } };
  area.addEventListener('pointerup',su);
  area.addEventListener('pointercancel',su);
  area.addEventListener('wheel',e=>{
    e.preventDefault();
    scala=Math.min(6,Math.max(1,scala*(e.deltaY<0?1.15:0.87)));
    applica();
  },{passive:false});
  let ultimoTap=0;
  area.addEventListener('click',()=>{
    const ora=Date.now();
    if(ora-ultimoTap<300){ scala=scala>1?1:2.5; applica(); }
    ultimoTap=ora;
  });
}

function render(){
  const app=document.getElementById('app');
  let html;
  if(!S.account)                 html = renderOnboarding();
  else if(S.sostituzione)        html = renderSostituzione();
  else if(S.account.stato==='attesa') html = renderInAttesa();
  else if(S.selPrj)              html = renderPrjDetail();
  else html = `
    <div style="height:100dvh;display:flex;flex-direction:column;overflow:hidden">
      <div style="flex:1;overflow-y:auto;padding-bottom:5.5rem">${renderPagina()}</div>
      ${renderNav()}
    </div>
    ${S.showNewPrj?renderNewPrjModal():''}
    ${S.showSquadra?renderSquadraModal():''}`;
  app.innerHTML = html + (S.lightbox?renderVisore():'') + (S.msg?renderAvviso():'');
}

function creaAzienda(){
  const az=val('r-az'), nome=val('r-nome'), mail=val('r-mail'), pwd=val('r-pwd');
  if(!az)   return avviso('Scrivi il nome dell\'azienda','ko');
  if(!nome) return avviso('Scrivi il tuo nome','ko');
  if(!mail.includes('@')) return avviso('Email non valida','ko');
  if(pwd.length<8) return avviso('La password deve avere almeno 8 caratteri','ko');
  const [n,...r]=nome.split(' ');
  const codice=codiceAzienda();
  save('azienda',{nome:az,codice,creata:new Date().toISOString(),approvaTutti:true});
  const acc={id:db.id(),nome:n,cognome:r.join(' '),email:mail,pwd:hash(pwd),tipo:'capo',ruolo:'Titolare',qualifiche:'',photo64:'',stato:'attivo'};
  save('account',acc);
  save('membri',[{...acc,pwd:undefined}]);
  registraDispositivo();
  addTimeline(`Ha creato l'azienda ${az}`,'SUCCESS');
  render();
  avviso('Azienda creata! Il codice è nel Profilo');
}

function entraInAzienda(){
  const cod=val('o-cod').toUpperCase(), nome=val('o-nome'), ruolo=val('o-ruolo'), mail=val('o-mail'), pwd=val('o-pwd');
  if(!cod) return avviso('Serve il codice azienda','ko');
  if(!S.azienda) return avviso('Su questo dispositivo non c\'è nessuna azienda. In anteprima locale devi prima registrarne una.','ko');
  if(cod!==S.azienda.codice) return avviso('Codice azienda sbagliato','ko');
  if(!nome) return avviso('Scrivi il tuo nome','ko');
  if(!mail.includes('@')) return avviso('Email non valida','ko');
  if(pwd.length<8) return avviso('La password deve avere almeno 8 caratteri','ko');
  const [n,...r]=nome.split(' ');
  const acc={id:db.id(),nome:n,cognome:r.join(' '),email:mail,pwd:hash(pwd),tipo:'operatore',ruolo:ruolo||'Operatore',qualifiche:'',photo64:'',stato:'attesa'};
  save('account',acc);
  save('membri',[...S.membri,{...acc,pwd:undefined}]);
  registraDispositivo();
  render();
}

function accedi(){
  const mail=val('a-mail'), pwd=val('a-pwd');
  const m=S.membri.find(x=>x.email===mail);
  if(!m) return avviso('Nessun account con questa email su questo dispositivo','ko');
  if(S.account && S.account.email===mail && S.account.pwd!==hash(pwd)) return avviso('Password sbagliata','ko');
  save('account',{...m,pwd:hash(pwd)});
  if(!verificaDispositivo()) return;
  render();
}

// ══════════════════════════════════════════════════════════════
function impronta(){
  let f=localStorage.getItem('rig_impronta');
  if(!f){ f=db.id()+db.id(); localStorage.setItem('rig_impronta',f); }
  return f;
}
function tipoDispositivo(){
  return /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent) ? 'telefono' : 'pc';
}
function nomeDispositivo(){
  const u=navigator.userAgent;
  if(/iPhone/i.test(u)) return 'iPhone';
  if(/iPad/i.test(u)) return 'iPad';
  if(/Android/i.test(u)) return 'Telefono Android';
  if(/Mac/i.test(u)) return 'Mac';
  if(/Windows/i.test(u)) return 'PC Windows';
  return 'Dispositivo';
}
function registraDispositivo(){
  const f=impronta();
  const miei=S.dispositivi.filter(d=>d.accountId===S.account.id);
  if(miei.some(d=>d.impronta===f)){
    save('dispositivi',S.dispositivi.map(d=>d.impronta===f&&d.accountId===S.account.id?{...d,ultimo:new Date().toISOString()}:d));
    return true;
  }
  if(miei.length>=2) return false;
  save('dispositivi',[...S.dispositivi,{id:db.id(),accountId:S.account.id,impronta:f,tipo:tipoDispositivo(),nome:nomeDispositivo(),ultimo:new Date().toISOString(),registrato:new Date().toISOString()}]);
  return true;
}
function verificaDispositivo(){
  if(registraDispositivo()) return true;
  S.sostituzione={fase:'scegli',scelto:null,codice:null,tentativi:0};
  render();
  return false;
}

      </div>
      <button onclick="S.sostituzione=null;esci()" style="background:none;border:none;color:#52525b;font-size:.75rem;font-weight:700;cursor:pointer">Annulla</button>`;

  else if(S_.fase==='codice'){
    const d=miei.find(x=>x.id===S_.scelto);
    corpo=`

      </p>
      <div style="${sCard};width:100%;max-width:21rem;background:rgba(249,115,22,.07);border-color:rgba(249,115,22,.3)">
        <p style="${sSot};margin-bottom:.5rem">Anteprima locale — il codice è</p>
        <p class="fd" style="font-size:2rem;font-weight:900;letter-spacing:.3em;color:#f97316;text-align:center">${S_.codice}</p>
        <p style="font-size:.65rem;color:#52525b;text-align:center;margin-top:.5rem">Con il server attivo arriva per email e scade in 10 minuti</p>
      </div>
      <div style="width:100%;max-width:21rem;display:flex;flex-direction:column;gap:1rem">
        <input id="otp" inputmode="numeric" maxlength="6" style="${sInput};text-align:center;font-size:1.5rem;letter-spacing:.4em;font-weight:900" placeholder="------">
        <button onclick="confermaSostituzione()" style="${sBtn}">Conferma sostituzione</button>
        <p style="font-size:.7rem;color:#52525b;text-align:center">Sostituirai: <b style="color:#a1a1aa">${esc(d?.nome||'')}</b> · tentativi rimasti: ${3-S_.tentativi}</p>
      </div>

  return `<div class="su" style="height:100dvh;overflow-y:auto;background:#09090b;padding:2.5rem 1.5rem;display:flex;flex-direction:column;align-items:center;gap:1.5rem">

}

function scegliSostituzione(id){
  S.sostituzione.scelto=id;
  S.sostituzione.codice=codiceOTP();
  S.sostituzione.fase='codice';
  render();
}
function confermaSostituzione(){
  const inserito=val('otp');
  if(inserito!==S.sostituzione.codice){
    S.sostituzione.tentativi++;
    if(S.sostituzione.tentativi>=3){ S.sostituzione=null; render(); return avviso('Troppi tentativi. Richiedi un nuovo codice.','ko'); }
    render(); return avviso('Codice sbagliato','ko');
  }
  const vecchio=S.sostituzione.scelto;
  save('dispositivi',[
    ...S.dispositivi.filter(d=>d.id!==vecchio),
    {id:db.id(),accountId:S.account.id,impronta:impronta(),tipo:tipoDispositivo(),nome:nomeDispositivo(),ultimo:new Date().toISOString(),registrato:new Date().toISOString()}
  ]);
  addTimeline('Ha sostituito un dispositivo','WARNING');
  S.sostituzione=null;
  render(); avviso('Dispositivo sostituito');
}

function decidi(id,stato){
  const m=S.membri.find(x=>x.id===id); if(!m) return;
  if(stato==='rifiutato'){ save('membri',S.membri.filter(x=>x.id!==id)); }
  else { save('membri',S.membri.map(x=>x.id===id?{...x,stato}:x)); }
  // Resta scritto chi ha deciso: serve il giorno che entra qualcuno che non doveva entrare.
  addTimeline(`Ha ${stato==='attivo'?'approvato':'rifiutato'} l'ingresso di ${m.nome} ${m.cognome}`, stato==='attivo'?'SUCCESS':'WARNING');
  render(); avviso(stato==='attivo'?'Operatore approvato':'Richiesta rifiutata');
}

function updSugg(){
  const el=document.getElementById('sugg-box'); if(!el) return;
  const v=document.getElementById('mat-in')?.value||''; S.newMat=v;
  const m=S.sugg.filter(s=>v&&s.toLowerCase().includes(v.toLowerCase())&&s.toLowerCase()!==v.toLowerCase());
  if(!v||!m.length){el.style.display='none';return;}
  el.style.display='block';
  el.innerHTML=m.map(s=>`<button type="button" onclick="pickSugg(${JSON.stringify(s).replace(/"/g,'&quot;')})" style="width:100%;text-align:left;padding:.75rem 1rem;font-size:.75rem;font-weight:700;color:#a1a1aa;background:none;border:none;border-bottom:1px solid #27272a;cursor:pointer">${esc(s)}</button>`).join('');
}
const hideSugg=()=>{const el=document.getElementById('sugg-box');if(el)el.style.display='none';};
function pickSugg(v){ S.newMat=v; const i=document.getElementById('mat-in'); if(i)i.value=v; hideSugg(); }
function addSugg(v){ if(!v||S.sugg.includes(v))return; save('sugg',[...S.sugg,v]); render(); }
function rmSugg(i){ save('sugg',S.sugg.filter((_,j)=>j!==i)); render(); }
function addMat(){
  const nome=(document.getElementById('mat-in')?.value||S.newMat).trim();
  if(!nome) return avviso('Scrivi il nome del materiale','ko');
  save('materials',[...S.materials,{id:db.id(),nome,qta:0,allarme:false,agg:new Date().toISOString()}]);
  S.newMat=''; render();
}
function qta(id,d){
  save('materials',S.materials.map(m=>{
    if(m.id!==id) return m;
    const q=Math.max(0,m.qta+d);
    if(q!==m.qta) addTimeline(`${d>0?'Aggiunto':'Prelevato'} ${Math.abs(d)} pz di ${m.nome} · totale ${q}`, d>0?'INFO':'WARNING');
    return {...m,qta:q,agg:new Date().toISOString()};
  }));
  render();
}
function allarme(id){ save('materials',S.materials.map(m=>m.id===id?{...m,allarme:!m.allarme}:m)); render(); }
function delMat(id){ if(!confirm('Eliminare questo materiale?'))return; save('materials',S.materials.filter(m=>m.id!==id)); render(); }

// Il freno (debounce) che mancava: senza, ogni lettera digitata e' una
// richiesta al server delle mappe, e dopo poco ti blocca.
let timerAddr=null;
function cercaIndirizzo(v){
  clearTimeout(timerAddr);
  if(v.length<4){ S.addrSugg=[]; return; }
  timerAddr=setTimeout(async()=>{
    try{
      const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(v)}&limit=5`);
      S.addrSugg=await r.json();
    }catch{ S.addrSugg=[]; }
    render();
    const i=document.getElementById('np-addr'); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length); }
  },600);
}
function pickAddr(nome,lat,lng){ S.newPrj.addr=nome; S.newPrjCoords={lat:+lat,lng:+lng}; S.addrSugg=[]; render(); }
function creaPrj(){
  const nome=(document.getElementById('np-name')?.value||S.newPrj.name).trim();
  if(!nome) return avviso('Serve il nome del cantiere','ko');
  save('projects',[{id:db.id(),nome,descrizione:S.newPrj.desc,indirizzo:S.newPrj.addr,inizio:S.newPrj.date,coord:S.newPrjCoords,foto:[],fasi:[],note:[],creato:new Date().toISOString()},...S.projects]);
  S.showNewPrj=false; addTimeline(`Ha aperto il cantiere ${nome}`,'SUCCESS'); render();
}

function prjInfo(p){

            : `<span onclick="S.editMilId='${f.id}';render()" style="flex:1;font-size:.85rem;${f.fatta?'text-decoration:line-through;color:#52525b':'color:white'};cursor:text">${esc(f.testo)}</span>`}

function prjNote(p){
  const n=p.note||[];
  return `<div style="display:flex;flex-direction:column;gap:1rem;min-height:calc(100dvh - 240px)">
    ${n.length===0?`<div style="text-align:center;padding:2.5rem;color:#3f3f46;display:flex;flex-direction:column;align-items:center;gap:1rem"><span style="font-size:2.5rem">📋</span><p style="${sSot}">Note del cantiere</p></div>`:''}

      <div style="background:#f97316;color:#09090b;padding:.9rem 1rem;border-radius:1.25rem;border-top-right-radius:.25rem;font-size:.85rem;line-height:1.5;font-weight:500">${esc(m.testo)}</div>
      <span style="font-size:.62rem;color:#52525b;font-weight:700;margin-top:.3rem">${esc(m.autore)} · ${fmtTime(m.quando)}</span>

    <div style="position:sticky;bottom:0;padding-top:1rem;background:#09090b">
      <div style="display:flex;align-items:flex-end;gap:.5rem;background:#18181b;border:1px solid #27272a;border-radius:1.75rem;padding:.25rem">
        <textarea id="pn-in" rows="1" placeholder="Scrivi una nota..." style="flex:1;background:transparent;border:none;font-size:.85rem;padding:.5rem 1rem;min-height:40px;max-height:7rem;resize:none;color:white"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();addNotaPrj('${p.id}')}"></textarea>
        <button onclick="addNotaPrj('${p.id}')" style="background:#f97316;color:#09090b;padding:.7rem;border-radius:1.5rem;border:none;cursor:pointer;display:flex;margin:.25rem">${I.send}</button>
      </div>
    </div>
  </div>`;
}
function prjFoto(p){
  const f=p.foto||[];
  const peso=f.reduce((a,x)=>a+pesoKB(x),0);
  return `<div style="display:flex;flex-direction:column;gap:1rem">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div>
        <p style="${sSot}">Foto del cantiere</p>
        <p style="font-size:.6rem;font-weight:700;color:#3f3f46">${f.length} foto · ${peso} KB · tocca per ingrandire</p>
      </div>
      <label style="background:#f97316;color:#09090b;padding:.7rem;border-radius:1rem;cursor:pointer;display:flex">
        ${I.plus}<input type="file" multiple accept="image/*" style="display:none" onchange="addFoto('${p.id}',this)">
      </label>
    </div>
    ${f.length===0?`<div style="text-align:center;padding:3rem;color:#3f3f46;display:flex;flex-direction:column;align-items:center;gap:1rem">${I.img}<p style="${sSot}">Nessuna foto</p></div>`
    :`<div style="display:grid;grid-template-columns:1fr 1fr;gap:.9rem">
      ${f.map((img,i)=>`<div style="position:relative;aspect-ratio:1;border-radius:1.25rem;overflow:hidden;border:1px solid #27272a">
        <img src="${img}" onclick="apriFotoPrj('${p.id}',${i})" style="width:100%;height:100%;object-fit:cover;cursor:zoom-in">
        <button onclick="event.stopPropagation();delFoto('${p.id}',${i})" style="position:absolute;top:.5rem;right:.5rem;background:rgba(0,0,0,.65);padding:.45rem;border-radius:.7rem;border:none;cursor:pointer;color:white;display:flex">${I.trash}</button>
      </div>`).join('')}
    </div>`}
  </div>`;
}
function mapPrj(pid,fn){ save('projects',S.projects.map(p=>p.id===pid?fn(p):p)); }
function toggleFase(pid,fid){
  const p=S.projects.find(x=>x.id===pid);
  const f=p.fasi.find(x=>x.id===fid);
  if(f&&!f.fatta) addTimeline(`Completata fase "${f.testo}" su ${p.nome}`,'SUCCESS');
  mapPrj(pid,p=>({...p,fasi:p.fasi.map(x=>x.id===fid?{...x,fatta:!x.fatta}:x)}));
  render();
}
function addFase(pid,testo){ mapPrj(pid,p=>({...p,fasi:[...p.fasi,{id:db.id(),testo,fatta:false}]})); render(); }
function salvaFase(pid,fid,testo){ S.editMilId=null; mapPrj(pid,p=>({...p,fasi:p.fasi.map(x=>x.id===fid?{...x,testo}:x)})); render(); }
function delFase(pid,fid){ if(!confirm('Eliminare questa fase?'))return; mapPrj(pid,p=>({...p,fasi:p.fasi.filter(x=>x.id!==fid)})); render(); }
function addNotaPrj(pid){
  const el=document.getElementById('pn-in'); if(!el||!el.value.trim())return;
  const autore=`${S.account.nome} ${S.account.cognome}`.trim();
  mapPrj(pid,p=>({...p,note:[...(p.note||[]),{id:db.id(),testo:el.value.trim(),autore,quando:new Date().toISOString()}]}));
  render();
}
async function addFoto(pid,input){
  const files=Array.from(input.files||[]); if(!files.length) return;
  avviso(`Comprimo ${files.length} foto...`);
  const out=[];
  for(const f of files){ const c=await comprimi(f); if(c) out.push(c); }
  mapPrj(pid,p=>({...p,foto:[...(p.foto||[]),...out]}));
  render();
  avviso(`${out.length} foto aggiunte · ${out.reduce((a,x)=>a+pesoKB(x),0)} KB in tutto`);
}
function delFoto(pid,i){ if(!confirm('Eliminare questa foto?'))return; mapPrj(pid,p=>({...p,foto:p.foto.filter((_,j)=>j!==i)})); render(); }

          ${n.imgs?.length?`<div style="display:grid;grid-template-columns:${n.imgs.length>1?'1fr 1fr':'1fr'};gap:.4rem;margin-bottom:.5rem">${n.imgs.map((im,k)=>`<img src="${im}" onclick="apriFotoNota('${n.id}',${k})" style="border-radius:.7rem;width:100%;aspect-ratio:1;object-fit:cover;cursor:zoom-in">`).join('')}</div>`:''}
          ${esc(n.testo)}
          <button onclick="delNota('${n.id}')" style="position:absolute;top:.4rem;right:.4rem;background:rgba(0,0,0,.2);border:none;cursor:pointer;color:rgba(0,0,0,.5);border-radius:.4rem;padding:.15rem;display:flex">${I.trash.replace(/18/g,'13')}</button>

        <span style="font-size:.62rem;color:#52525b;font-weight:700;margin-top:.3rem">${fmtDataOra(n.quando)}</span>
      </div>`).join('')}
    </div>
    <div style="display:flex;align-items:flex-end;gap:.5rem;background:#18181b;border:1px solid #27272a;border-radius:1.75rem;padding:.25rem;flex-shrink:0">
      <label style="padding:.7rem;color:#71717a;cursor:pointer;display:flex;position:relative">
        ${I.img}<input type="file" multiple accept="image/*" style="display:none" onchange="notaFoto(this)">
        ${S.noteImgs.length?`<span style="position:absolute;top:.3rem;right:.3rem;width:1rem;height:1rem;background:#f97316;color:#09090b;font-size:.58rem;font-weight:900;border-radius:50%;display:flex;align-items:center;justify-content:center">${S.noteImgs.length}</span>`:''}
      </label>
      <textarea id="nota-in" rows="1" placeholder="Scrivi una nota..." style="flex:1;background:transparent;border:none;font-size:.85rem;padding:.5rem 0;min-height:40px;max-height:7rem;resize:none;color:white"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();addNota()}"></textarea>
      <button onclick="addNota()" style="background:#f97316;color:#09090b;padding:.7rem;border-radius:1.5rem;border:none;cursor:pointer;display:flex;margin:.25rem">${I.send}</button>
    </div>
  </div>`;
}
async function notaFoto(input){
  const files=Array.from(input.files||[]).slice(0,6); if(!files.length) return;
  for(const f of files){ const c=await comprimi(f,1920,.82); if(c) S.noteImgs.push(c); }
  render();
}
function addNota(){
  const el=document.getElementById('nota-in');
  const testo=(el?.value||'').trim();
  if(!testo&&!S.noteImgs.length) return;
  save('notes',[...S.notes,{id:db.id(),testo,imgs:[...S.noteImgs],quando:new Date().toISOString()}]);
  S.noteImgs=[]; render();
}
function delNota(id){ save('notes',S.notes.filter(n=>n.id!==id)); render(); }

async function fotoProfilo(input){
  const f=input.files?.[0]; if(!f) return;
  const c=await comprimi(f,512,.8); if(!c) return;
  const a={...S.account,photo64:c}; save('account',a);
  save('membri',S.membri.map(m=>m.id===a.id?{...m,photo64:c}:m));
  render();
}
function salvaProfilo(){
  const a={...S.account,nome:val('pf-nome'),cognome:val('pf-cog'),ruolo:val('pf-ruolo'),qualifiche:val('pf-qual')};
  save('account',a);
  save('membri',S.membri.map(m=>m.id===a.id?{...m,...a,pwd:undefined}:m));
  render(); avviso('Profilo salvato');
}
function nuovoCodice(){
  if(!confirm('Generare un nuovo codice? Il vecchio smetterà di funzionare.')) return;
  save('azienda',{...S.azienda,codice:codiceAzienda()});
  addTimeline('Ha cambiato il codice azienda','WARNING');
  render(); avviso('Nuovo codice generato');
}
function setApprova(tutti){ save('azienda',{...S.azienda,approvaTutti:tutti}); render(); }
function scollega(id){
  if(!confirm('Scollegare questo dispositivo?')) return;
  save('dispositivi',S.dispositivi.filter(d=>d.id!==id));
  addTimeline('Ha scollegato un dispositivo','WARNING');
  render(); avviso('Dispositivo scollegato');
}
function provaTerzo(){
  const miei=S.dispositivi.filter(d=>d.accountId===S.account.id);
  if(miei.length<2) return avviso('Hai ancora un posto libero: il terzo dispositivo scatta quando ne hai due','ko');
  S.sostituzione={fase:'scegli',scelto:null,codice:null,tentativi:0}; render();
}
function esporta(){
  const dati={}; for(const k in localStorage){ if(k.startsWith('rig_')) dati[k]=localStorage[k]; }
  const blob=new Blob([JSON.stringify({app:'RigOps',versione:1,quando:new Date().toISOString(),dati},null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`rigops-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  avviso('Backup scaricato');
}
function importa(input){
  const f=input.files?.[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const j=JSON.parse(r.result);
      if(j.app!=='RigOps') throw 0;
      if(!confirm('Sostituire tutti i dati attuali con quelli del backup?')) return;
      for(const k in j.dati) localStorage.setItem(k,j.dati[k]);
      location.reload();
    }catch{ avviso('File di backup non valido','ko'); }
  };
  r.readAsText(f);
}
function cancellaTutto(){
  if(!confirm('Eliminare TUTTI i dati di RigOps su questo dispositivo? Non si torna indietro.')) return;
  for(const k of Object.keys(localStorage)) if(k.startsWith('rig_')) localStorage.removeItem(k);
  location.reload();
}

// ── AVVIO ──────────────────────────────────────────────────────
if(S.account && S.account.stato==='attivo') registraDispositivo();
render();
meteo();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
